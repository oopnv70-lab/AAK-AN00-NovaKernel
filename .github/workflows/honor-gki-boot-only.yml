name: 荣耀GKI boot-only 构建 (android15-6.6)

# 目标：用荣耀开源 common（android15-6.6）编出【一个 boot.img】，内核内置 SukiSU-Nova（KSU）。
#   - 只产出 boot.img 一个产物（fastboot flash boot 刷入），不打包 AnyKernel3、不产 system_dlkm、不产单独 Image。
#   - root 管理器（SukiSU-Nova）内置在内核里，随 boot 一起，刷完即有 root。
#   - 不碰 recovery（独立 A/B 分区，且无其源码）、不碰 init_boot、不碰 ramdisk。
#
# 构建预算约束（重要）：Kleaf 全量 GKI 在 2 核 runner 约 40+ 分钟。
#   → 不要为看排版/试流程反复触发；只在真正要出成品时跑。
#
# 现实边界：自编译 GKI 未用 Google 私钥签名，且公开源码 6.6.56 ≠ 真机 6.6.89，
#   AVB/vermagic 与真机固件不匹配时刷入也开不了机；本分支只是产出「形态正确、可直接 fastboot flash」
#   的分区镜像，供解锁后/固件对齐后使用。

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Honor 型号代号（= 源码包文件名前缀）'
        required: true
        default: 'AAK-AN00'
      sync_linux_security:
        description: '同步 Linux 内核上游 6.6.y stable 安全补丁（拉到最新稳定版；冲突跳过并记录，仅静态编译验证）'
        required: false
        default: false
        type: boolean
      manager:
        description: '内置管理器（当前仅 SukiSU-Nova，其他管理器暂不支持）'
        required: false
        default: 'sukisu_nova'
        type: choice
        options:
          - sukisu_nova
      enable_susfs:
        description: '是否集成 SUSFS（路径隐藏/重定向/maps 欺骗等；默认开启）'
        required: false
        default: true
        type: boolean
      strict_abi_check:
        description: '是否做严格 ABI/KMI 校验（STG 全类型图比对，含保护符号表；默认关闭；开启后只报告不阻断）'
        required: false
        default: false
        type: boolean

concurrency:
  group: honor-gki-boot-only
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL: ${{ github.event.inputs.model || 'AAK-AN00' }}
  BRANCH: common-android15-6.6
  SYNC_LINUX_SECURITY: ${{ github.event.inputs.sync_linux_security || 'false' }}
  MANAGER: ${{ github.event.inputs.manager || 'sukisu_nova' }}
  ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs || 'true' }}
  STRICT_ABI_CHECK: ${{ github.event.inputs.strict_abi_check || 'false' }}
  KP_DIR: ${{ github.workspace }}/kp

jobs:
  build:
    name: 荣耀GKI boot.img
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools libxml2-utils aria2

      - name: 记录运行机指纹
        run: |
          set -uo pipefail
          echo "nproc=$(nproc)"; grep -m1 'model name' /proc/cpuinfo || true
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || true; df -h / | tail -1

      - name: 安装 repo 同步工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 拉取荣耀开源代码 (${{ env.MODEL }})
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      - name: 同步 AOSP 内核基础工程 (${{ env.BRANCH }})
        run: |
          set -euxo pipefail
          mkdir -p "$KP_DIR"; cd "$KP_DIR"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1 --no-repo-verify
          repo sync -c --no-tags --optimized-fetch -j"$(nproc)" --force-sync
          if [ -d "$KP_DIR/kernel_platform/common" ]; then ROOT="$KP_DIR/kernel_platform"; else ROOT="$KP_DIR"; fi
          echo "KERNEL_PLATFORM=$ROOT" >> "$GITHUB_ENV"
          echo "识别到内核工程根目录: $ROOT"
          test -d "$ROOT/common" || { echo "::error::找不到 $ROOT/common"; exit 1; }
          du -sh "$KP_DIR"; df -h /

      - name: 用荣耀源码覆盖 common 内核目录
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          test -d "${KERNEL_PLATFORM}/common" || { echo "::error::common 不存在"; exit 1; }
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          miss=0
          for f in Makefile Kbuild BUILD.bazel build.config.gki.aarch64 arch/arm64/configs/gki_defconfig; do
            [ -e "${KERNEL_PLATFORM}/common/$f" ] && echo "  ✓ $f" || { echo "  ✗ $f"; miss=1; }
          done
          [ "$miss" -eq 0 ] || { echo "::error::覆盖后 common/ 缺关键文件"; exit 1; }

      - name: 同步 Linux 内核上游安全补丁（6.6.y stable → 最新）
        if: env.SYNC_LINUX_SECURITY == 'true'
        run: |
          set -uo pipefail
          cd "${KERNEL_PLATFORM}/common"
          # 基础版本号从 Makefile 读（荣耀源码 6.6.56）
          BASE_MAJOR=$(sed -n 's/^VERSION = //p' Makefile | tr -d ' ')
          BASE_PATCH=$(sed -n 's/^PATCHLEVEL = //p' Makefile | tr -d ' ')
          BASE_SUB=$(sed -n 's/^SUBLEVEL = //p' Makefile | tr -d ' ')
          BASE="${BASE_MAJOR}.${BASE_PATCH}.${BASE_SUB}"
          echo "基础版本: $BASE"
          # 动态拿 6.6.y 最新稳定版（kernel.org releases.json，不硬编码）
          LATEST=$(curl -fsSL 'https://www.kernel.org/releases.json' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); \
                vs=[r['version'] for r in d.get('releases',[]) \
                    if r['version'].startswith('${BASE_MAJOR}.${BASE_PATCH}.')]; \
                print(sorted(vs, key=lambda v:[int(x) for x in v.split('.')[2:]], reverse=True)[0])" 2>/dev/null)
          if [ -z "$LATEST" ]; then
            echo "::error::无法从 kernel.org 获取最新 ${BASE_MAJOR}.${BASE_PATCH}.y 版本"; exit 1;
          fi
          echo "最新 6.6.y stable: $LATEST"
          CUR="${BASE_MAJOR}.${BASE_PATCH}.${BASE_SUB}"
          if [ "$CUR" = "$LATEST" ]; then
            echo "==> 当前已是最新，无需打补丁"; exit 0;
          fi
          # 逐级打 incr 补丁：cur -> cur+1 -> ... -> latest
          TMPD="${GITHUB_WORKSPACE}/stable-patches"; mkdir -p "$TMPD"
          applied=0; rejected=0; total_hunks=0
          while [ "$CUR" != "$LATEST" ]; do
            CUR_MAJOR=$(echo "$CUR" | cut -d. -f1)
            CUR_MINOR=$(echo "$CUR" | cut -d. -f2)
            CUR_SUB=$(echo "$CUR" | cut -d. -f3)
            NEXT_SUB=$((CUR_SUB + 1))
            NEXT="${CUR_MAJOR}.${CUR_MINOR}.${NEXT_SUB}"
            PATCH_URL="https://cdn.kernel.org/pub/linux/kernel/v${CUR_MAJOR}.x/incr/patch-${CUR}-${NEXT_SUB}.xz"
            PATCH_XZ="$TMPD/patch-${CUR}-${NEXT_SUB}.xz"
            PATCH="$TMPD/patch-${CUR}-${NEXT_SUB}"
            echo "---- ${CUR} -> ${NEXT} ----"
            if ! curl -fsSL -o "$PATCH_XZ" "$PATCH_URL"; then
              echo "  ⚠ 补丁 ${PATCH_URL} 下载失败，跳过并终止打补丁"
              break
            fi
            xz -dkf "$PATCH_XZ"
            # 注意：不能用 --reject（GNU patch 无此长选项，会被判「选项歧义」退出码 2，
            # 导致 patch 空转、一个 hunk 都没打）。用 -f（force：失败 hunk 生成 .rej 并继续）
            # + --forward（忽略 reversed/already-applied）。-f 本身就会产出 .rej 文件。
            if patch -p1 -f --forward < "$PATCH" > "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>&1; then
              echo "  ✓ 干净应用（无失败 hunk）"
            else
              echo "  ⚠ 有冲突（-f 已生成 .rej 并跳过失败 hunk）"
            fi
            # 统计本次冲突
            n_rej=$(find . -name '*.rej' -newer "$PATCH" 2>/dev/null | wc -l | tr -d ' ')
            n_fail=$(grep -c 'FAILED' "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>/dev/null || true)
            n_succ=$(grep -c 'succeeded' "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>/dev/null || true)
            n_patch=$(grep -c 'patching file' "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>/dev/null || true)
            echo "    patching_file=$n_patch succeeded=$n_succ FAILED=$n_fail .rej=$n_rej"
            # 空转门禁：真正处理补丁时 patch 一定输出「patching file xxx」（或 dry-run 的
            # 「checking file」）。若一条都没有，说明 patch 根本没碰到任何文件（选项错误、
            # 补丁格式问题等），此时绝不能硬改 SUBLEVEL 制造「已同步」假象。
            # 注意：不能用 succeeded/FAILED 计数判断——「干净应用」（无 offset）时两者都是 0，
            # 但 patch 明明在工作（会输出 patching file），之前用这个判据误杀了干净补丁。
            if [ "$n_patch" -eq 0 ]; then
              echo "::error::补丁 ${CUR}->${NEXT} 空转（0 个文件被处理），patch 未生效，终止打补丁"
              tail -20 "$TMPD/apply-${CUR}-${NEXT_SUB}.log"
              exit 1
            fi
            rejected=$((rejected + n_fail))
            applied=$((applied + 1))
            # 更新版本号：SUBLEVEL 提到 NEXT_SUB（仅在补丁确实有 hunk 命中后）
            sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${NEXT_SUB}/" Makefile
            CUR="$NEXT"
          done
          echo "======================================"
          echo "打补丁完成: 应用 $applied 个版本，累计 FAILED hunk $rejected 个"
          echo "当前 Makefile 版本:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' Makefile
          REJFILES=$(find . -name '*.rej' 2>/dev/null | wc -l | tr -d ' ')
          echo ".rej 冲突文件总数: $REJFILES"
          {
            echo '### Linux 安全补丁同步结果'
            echo "- 基础版本: $BASE  →  目标: $LATEST"
            echo "- 应用补丁版本数: $applied"
            echo "- 累计 FAILED hunk: $rejected"
            echo "- .rej 文件数: $REJFILES"
            echo '- 说明: 冲突已 -f 生成 .rej 并跳过失败 hunk，仅做静态编译验证；能否刷入真机不保证'
            echo '```'
            find . -name '*.rej' 2>/dev/null | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 集成 SukiSU-Nova（builtin-new，CONFIG_KSU=y 内置）
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_sukisu.sh
          ./scripts/integrate_sukisu.sh "${KERNEL_PLATFORM}" "${MANAGER}"
          # 关键验证：软链 / fragment / BUILD.bazel 注入 是否就位
          test -f "${KERNEL_PLATFORM}/common/drivers/kernelsu/Kconfig" || exit 1
          test -f "${KERNEL_PLATFORM}/common/drivers/kernelsu/Makefile" || exit 1
          # fragment 方案：CONFIG_KSU=y 在 ksu_defconfig fragment 里，gki_defconfig 本体必须干净
          test -f "${KERNEL_PLATFORM}/common/ksu_defconfig" || { echo "::error::缺 ksu_defconfig"; exit 1; }
          grep -q '^CONFIG_KSU=y' "${KERNEL_PLATFORM}/common/ksu_defconfig" || { echo "::error::fragment 缺 CONFIG_KSU=y"; exit 1; }
          if grep -q '^CONFIG_KSU=' "${KERNEL_PLATFORM}/common/arch/arm64/configs/gki_defconfig"; then
            echo "::error::gki_defconfig 被污染（含 CONFIG_KSU），Kleaf minimized 校验必失败"; exit 1;
          fi
          grep -q '"defconfig_fragments": \["ksu_defconfig"\]' "${KERNEL_PLATFORM}/common/BUILD.bazel" \
            || { echo "::error::BUILD.bazel 未注入 defconfig_fragments"; exit 1; }
          echo '==== ksu_defconfig fragment 内容 ===='
          cat "${KERNEL_PLATFORM}/common/ksu_defconfig"

      - name: 集成 SUSFS（susfs4ksu gki-android15-6.6，官方流程）
        run: |
          set -uo pipefail
          chmod +x scripts/integrate_susfs.sh
          ./scripts/integrate_susfs.sh "${KERNEL_PLATFORM}"

      - name: 编译 GKI 内核（Kleaf，只编需要的 target）
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          LOG="$GITHUB_WORKSPACE/build.log"
          ls -l tools/bazel || { echo "::error::缺少 tools/bazel"; exit 1; }
          T0=$(date +%s)
          # 只建一个 target：kernel_aarch64_gki_artifacts -> boot.img（含内置 KSU 的内核）
          # 不建 kernel_aarch64（单独 Image）、不建 kernel_aarch64_images（system_dlkm）、不建 dist
          tools/bazel build --config=fast \
            //common:kernel_aarch64_gki_artifacts >>"$LOG" 2>&1 || {
            echo "::error::GKI 编译失败"
            { echo "### ❌ GKI 编译失败"; echo '```'
              grep -inE 'error|FAILED|fatal|Exception' "$LOG" | head -40; echo '```'
              echo '#### 末尾 60 行'; echo '```'; tail -60 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          T1=$(date +%s); echo "编译耗时 $((T1-T0))s"
          tail -15 "$LOG"

      - name: 严格 ABI/KMI 校验（STG 全类型图比对，只报告不阻断）
        if: env.STRICT_ABI_CHECK == 'true'
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          # Kleaf 官方 ABI 校验 target：把编译产物实际 ABI 与 android/abi_gki_aarch64.stg
          # 做 STG 全类型图精确 diff（符号缺失/结构体字段变化/枚举增删/字节大小变化都会报）。
          # exit code 非 0 = 检测到 ABI 变化（带 KSU+SUSFS 几乎必然非 0，属预期，不阻断）。
          echo "==> 运行 kleaf ABI 校验: //common:kernel_aarch64_abi_dist"
          ABILOG="$GITHUB_WORKSPACE/abi_check.log"
          if tools/bazel run --config=fast \
              //common:kernel_aarch64_abi_dist -- --destdir="$GITHUB_WORKSPACE/out_abi" \
              >"$ABILOG" 2>&1; then
            echo "  ✅ ABI 无变化（与 abi_gki_aarch64.stg 完全一致）"
          else
            echo "  ⚠ 检测到 ABI 变化（带 KSU/SUSFS 属预期，仅报告不阻断）"
          fi
          # 提取 diff 报告（若存在）写入 step summary
          DIFF=$(find "$GITHUB_WORKSPACE/out_abi" -name 'abi.report*' -o -name 'abi_diff*' 2>/dev/null | head -1)
          {
            echo '### 严格 ABI/KMI 校验结果'
            echo '- 校验 target: //common:kernel_aarch64_abi_dist（STG 全类型图比对）'
            echo '- 参考定义: common/android/abi_gki_aarch64.stg'
            echo ''
            echo '```'
            grep -iE 'diff|break|added|removed|changed|error|symbol' "$ABILOG" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '==== ABI 校验日志末尾 40 行 ===='
          tail -40 "$ABILOG"

      - name: 取出产物（仅 boot.img）
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          EXEC=$(tools/bazel info execution_root 2>/dev/null)
          echo "execroot=$EXEC"
          BOOT=$(find "$EXEC" -maxdepth 9 -type f -name 'boot.img' -path '*kernel_aarch64*' 2>/dev/null | head -1)
          [ -n "$BOOT" ] && [ -f "$BOOT" ] || { echo "::error::没有产出 boot.img"; exit 1; }
          cp -v "$BOOT" "$D/boot.img"
          # boot.img 头部 magic 必须是 ANDROID!（偏移 0，8 字节）
          MAGIC=$(od -An -c -j 0 -N 8 "$D/boot.img" 2>/dev/null | tr -d ' \n')
          echo "boot.img magic = $MAGIC"
          [ "$MAGIC" = "ANDROID!" ] || { echo "::error::boot.img 头 magic 不是 ANDROID!，产物不对"; exit 1; }
          # ===== KSU 编入门禁（确定性断言，缺任一项即失败，绝不让没编进 KSU 的包流出）=====
          # 用 strings 查两个铁证串：它们只会在 SukiSU-Nova 源码被实际编译进内核后出现。
          #   1) welcome to KernelSU version   —— KSU 初始化欢迎串
          #   2) 当前 manager 的包名           —— 管理器包名（动态，随 manager 选项）
          # 注意：不再用「version 30007」之类的版本号串当铁证。SukiSU-Nova 的 KSU_VERSION
          #   是动态计算的（kernel/Makefile: VERSION_BASE=30000, VERSION_OFFSET=4001,
          #   KSU_VERSION = 30000 + commit数 - 4001，无计数时 = 41000），不存在固定值，
          #   写死任何数字都会误杀。前两个铁证（欢迎串 + 包名）已足以证明 SukiSU-Nova 编入。
          case "$MANAGER" in
            sukisu_nova) KSU_PKG_NAME="com.sukisu.nova" ;;
            *) echo "::error::未知 manager=$MANAGER，门禁无法确定包名"; exit 1;;
          esac
          STRINGS_TMP="$D/boot.strings"
          strings -a "$D/boot.img" > "$STRINGS_TMP"
          ksu_ok=0
          for needle in 'welcome to KernelSU version' "$KSU_PKG_NAME"; do
            if grep -qF "$needle" "$STRINGS_TMP"; then
              echo "  ✓ KSU 铁证命中: $needle"
            else
              echo "  ✗ KSU 铁证缺失: $needle"
              ksu_ok=1
            fi
          done
          if [ "$ksu_ok" -ne 0 ]; then
            echo "::error::boot.img 里没有检测到 SukiSU-Nova 已编入（上述铁证串缺失），拒绝产出"
            exit 1
          fi
          echo "  ✅ KSU 门禁通过：SukiSU-Nova 已确认编入 boot.img（manager=$MANAGER）"
          # ===== SUSFS 编入门禁（对标 KSU 门禁，堵「能编译成功 = 假成功」的漏洞）=====
          # 之前的隐患：SUSFS 的所有校验都在【编译前】（补丁 .rej 清零 + fragment 写 =y + 自检
          # grep），编译后的 boot.img 里到底有没有 SUSFS，零断言——这就是「假成功」的结构性根因。
          # KSU 有 strings 铁证门禁，SUSFS 却没有。这里补齐：用 strings 查 SUSFS 独有的字符串，
          # 只有 fs/susfs.c 真正被编译进内核时才会出现，缺失即拒绝产出（不是只 warn）。
          #
          # 铁证串来源（susfs4ksu android15-6.6 分支 fs/susfs.c / include/linux/susfs.h）：
          #   1) "susfs is initialized! version: "  —— susfs_init() 的启动日志串（含 SUSFS_VERSION）
          #   2) "..5.u.S"                          —— susfs_fake_qstr_name 全局常量（非 static）
          #   3) "susfs: enable logging to kernel"  —— susfs_enable_log() 的 pr_info 串
          # 注意「不要用 v2.4.0 当铁证」：版本串可能被 CONFIG_KSU_SUSFS_* 裁剪后仍在，也可能
          # 与其它字符串子串相撞；上面 3 个是 SUSFS 独有的、与 KSU 串无重叠的硬铁证。
          # 只有当 ENABLE_SUSFS=true 时才要求这些串存在；false 时跳过（内核应不含 SUSFS）。
          if [ "$ENABLE_SUSFS" = "true" ]; then
            susfs_ok=0
            for needle in 'susfs is initialized! version:' '..5.u.S' 'susfs: enable logging to kernel'; do
              if grep -qF "$needle" "$STRINGS_TMP"; then
                echo "  ✓ SUSFS 铁证命中: $needle"
              else
                echo "  ✗ SUSFS 铁证缺失: $needle"
                susfs_ok=1
              fi
            done
            if [ "$susfs_ok" -ne 0 ]; then
              echo "::error::boot.img 里没有检测到 SUSFS 已编入（上述铁证串缺失），拒绝产出——"
              echo "::error::这正是「编译成功但 SUSFS 静默缺失」的假成功形态，必须拦截"
              exit 1
            fi
            echo "  ✅ SUSFS 门禁通过：susfs4ksu 已确认编入 boot.img"
          else
            echo "  ℹ ENABLE_SUSFS=false，跳过 SUSFS 门禁（内核应不含 SUSFS）"
          fi
          rm -f "$STRINGS_TMP"
          INFO=$(find "$EXEC" -maxdepth 9 -type f -name 'gki-info.txt' -path '*kernel_aarch64*' 2>/dev/null | head -1)
          if [ -n "$INFO" ]; then echo '==== gki-info.txt ===='; cat "$INFO"; fi
          ls -la "$D"

      - name: 上传 boot.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAK-AN00-GKI-boot
          path: |
            dist/boot.img
          if-no-files-found: error

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: build.log
          if-no-files-found: warn