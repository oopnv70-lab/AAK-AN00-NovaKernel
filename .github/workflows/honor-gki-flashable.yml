name: 荣耀GKI AnyKernel3 刷机包 (android15-6.6)

# 目标：用荣耀开源 common（android15-6.6）编出【可直接刷机】的 GKI 分区镜像。
#   - 只产出 boot.img + system_dlkm(img) 两个分区镜像，不参杂 .ko / 头文件 / sbom / vmlinux 等。
#   - boot.img 刷 boot 分区；system_dlkm.*.img 刷 system_dlkm 分区（自编 GKI 模块）。
#
# 构建预算约束（重要）：Kleaf 全量 GKI 在 2 核 runner 约 40+ 分钟。
#   → 不要为看排版/试流程反复触发；只在真正要出成品时跑。
#
# 现实边界：自编译 GKI 未用 Google 私钥签名，且公开源码 6.6.56 ≠ 真机 6.6.89，
#   AVB/vermagic 与真机固件不匹配时刷入也开不了机；本分支只是产出「形态正确、可直接 fastboot flash」
#   的分区镜像，供解锁后/固件对齐后使用。

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Honor 型号代号（= 源码包文件名前缀）'
        required: true
        default: 'AAK-AN00'
      sync_linux_security:
        description: '同步 Linux 内核上游 6.6.y stable 安全补丁（拉到最新稳定版；冲突跳过并记录，仅静态编译验证）'
        required: false
        default: false
        type: boolean
      manager:
        description: '内置管理器（sukisu_nova = 内置 root；none = 不内置 root，纯净 GKI，跳过 SukiSU/SUSFS/KPM）'
        required: false
        default: 'sukisu_nova'
        type: choice
        options:
          - sukisu_nova
          - none
      enable_susfs:
        description: '是否集成 SUSFS（路径隐藏/重定向/maps 欺骗等；默认开启）'
        required: false
        default: true
        type: boolean
      enable_kpm:
        description: '是否集成 KPM（KernelPatch 内核补丁模块加载器；需 CONFIG_KPM + KernelPatch 后处理；默认关闭）'
        required: false
        default: false
        type: boolean
      strict_abi_check:
        description: '是否做严格 ABI/KMI 校验（STG 全类型图比对，含保护符号表；默认关闭；开启后只报告不阻断）'
        required: false
        default: false
        type: boolean

concurrency:
  group: honor-gki-flashable
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL: ${{ github.event.inputs.model || 'AAK-AN00' }}
  BRANCH: common-android15-6.6
  SYNC_LINUX_SECURITY: ${{ github.event.inputs.sync_linux_security || 'false' }}
  MANAGER: ${{ github.event.inputs.manager || 'sukisu_nova' }}
  ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs || 'true' }}
  ENABLE_KPM: ${{ github.event.inputs.enable_kpm || 'false' }}
  STRICT_ABI_CHECK: ${{ github.event.inputs.strict_abi_check || 'false' }}
  KP_DIR: ${{ github.workspace }}/kp

jobs:
  build:
    name: 荣耀GKI可刷镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools libxml2-utils aria2

      - name: 记录运行机指纹
        run: |
          set -uo pipefail
          echo "nproc=$(nproc)"; grep -m1 'model name' /proc/cpuinfo || true
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || true; df -h / | tail -1

      - name: 安装 repo 同步工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 拉取荣耀开源代码 (${{ env.MODEL }})
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      - name: 同步 AOSP 内核基础工程 (${{ env.BRANCH }})
        run: |
          set -euxo pipefail
          mkdir -p "$KP_DIR"; cd "$KP_DIR"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1 --no-repo-verify
          repo sync -c --no-tags --optimized-fetch -j"$(nproc)" --force-sync
          if [ -d "$KP_DIR/kernel_platform/common" ]; then ROOT="$KP_DIR/kernel_platform"; else ROOT="$KP_DIR"; fi
          echo "KERNEL_PLATFORM=$ROOT" >> "$GITHUB_ENV"
          echo "识别到内核工程根目录: $ROOT"
          test -d "$ROOT/common" || { echo "::error::找不到 $ROOT/common"; exit 1; }
          du -sh "$KP_DIR"; df -h /

      - name: 用荣耀源码覆盖 common 内核目录
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          test -d "${KERNEL_PLATFORM}/common" || { echo "::error::common 不存在"; exit 1; }
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          miss=0
          for f in Makefile Kbuild BUILD.bazel build.config.gki.aarch64 arch/arm64/configs/gki_defconfig; do
            [ -e "${KERNEL_PLATFORM}/common/$f" ] && echo "  ✓ $f" || { echo "  ✗ $f"; miss=1; }
          done
          [ "$miss" -eq 0 ] || { echo "::error::覆盖后 common/ 缺关键文件"; exit 1; }

      - name: 同步 Linux 内核上游安全补丁（6.6.y stable → 最新）
        if: env.SYNC_LINUX_SECURITY == 'true'
        run: |
          set -uo pipefail
          cd "${KERNEL_PLATFORM}/common"
          # 基础版本号从 Makefile 读（荣耀源码 6.6.56）
          BASE_MAJOR=$(sed -n 's/^VERSION = //p' Makefile | tr -d ' ')
          BASE_PATCH=$(sed -n 's/^PATCHLEVEL = //p' Makefile | tr -d ' ')
          BASE_SUB=$(sed -n 's/^SUBLEVEL = //p' Makefile | tr -d ' ')
          BASE="${BASE_MAJOR}.${BASE_PATCH}.${BASE_SUB}"
          echo "基础版本: $BASE"
          # 动态拿 6.6.y 最新稳定版（kernel.org releases.json，不硬编码）
          LATEST=$(curl -fsSL 'https://www.kernel.org/releases.json' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); \
                vs=[r['version'] for r in d.get('releases',[]) \
                    if r['version'].startswith('${BASE_MAJOR}.${BASE_PATCH}.')]; \
                print(sorted(vs, key=lambda v:[int(x) for x in v.split('.')[2:]], reverse=True)[0])" 2>/dev/null)
          if [ -z "$LATEST" ]; then
            echo "::error::无法从 kernel.org 获取最新 ${BASE_MAJOR}.${BASE_PATCH}.y 版本"; exit 1;
          fi
          echo "最新 6.6.y stable: $LATEST"
          CUR="${BASE_MAJOR}.${BASE_PATCH}.${BASE_SUB}"
          if [ "$CUR" = "$LATEST" ]; then
            echo "==> 当前已是最新，无需打补丁"; exit 0;
          fi
          # 逐级打 incr 补丁：cur -> cur+1 -> ... -> latest
          TMPD="${GITHUB_WORKSPACE}/stable-patches"; mkdir -p "$TMPD"
          applied=0; rejected=0; total_hunks=0
          while [ "$CUR" != "$LATEST" ]; do
            CUR_MAJOR=$(echo "$CUR" | cut -d. -f1)
            CUR_MINOR=$(echo "$CUR" | cut -d. -f2)
            CUR_SUB=$(echo "$CUR" | cut -d. -f3)
            NEXT_SUB=$((CUR_SUB + 1))
            NEXT="${CUR_MAJOR}.${CUR_MINOR}.${NEXT_SUB}"
            PATCH_URL="https://cdn.kernel.org/pub/linux/kernel/v${CUR_MAJOR}.x/incr/patch-${CUR}-${NEXT_SUB}.xz"
            PATCH_XZ="$TMPD/patch-${CUR}-${NEXT_SUB}.xz"
            PATCH="$TMPD/patch-${CUR}-${NEXT_SUB}"
            echo "---- ${CUR} -> ${NEXT} ----"
            if ! curl -fsSL -o "$PATCH_XZ" "$PATCH_URL"; then
              echo "  ⚠ 补丁 ${PATCH_URL} 下载失败，跳过并终止打补丁"
              break
            fi
            xz -dkf "$PATCH_XZ"
            # 注意：不能用 --reject（GNU patch 无此长选项，会被判「选项歧义」退出码 2，
            # 导致 patch 空转、一个 hunk 都没打）。用 -f（force：失败 hunk 生成 .rej 并继续）
            # + --forward（忽略 reversed/already-applied）。-f 本身就会产出 .rej 文件。
            if patch -p1 -f --forward < "$PATCH" > "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>&1; then
              echo "  ✓ 干净应用（无失败 hunk）"
            else
              echo "  ⚠ 有冲突（-f 已生成 .rej 并跳过失败 hunk）"
            fi
            # 统计本次冲突
            n_rej=$(find . -name '*.rej' -newer "$PATCH" 2>/dev/null | wc -l | tr -d ' ')
            n_fail=$(grep -c 'FAILED' "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>/dev/null || true)
            n_succ=$(grep -c 'succeeded' "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>/dev/null || true)
            n_patch=$(grep -c 'patching file' "$TMPD/apply-${CUR}-${NEXT_SUB}.log" 2>/dev/null || true)
            echo "    patching_file=$n_patch succeeded=$n_succ FAILED=$n_fail .rej=$n_rej"
            # 空转门禁：真正处理补丁时 patch 一定输出「patching file xxx」（或 dry-run 的
            # 「checking file」）。若一条都没有，说明 patch 根本没碰到任何文件（选项错误、
            # 补丁格式问题等），此时绝不能硬改 SUBLEVEL 制造「已同步」假象。
            # 注意：不能用 succeeded/FAILED 计数判断——「干净应用」（无 offset）时两者都是 0，
            # 但 patch 明明在工作（会输出 patching file），之前用这个判据误杀了干净补丁。
            if [ "$n_patch" -eq 0 ]; then
              echo "::error::补丁 ${CUR}->${NEXT} 空转（0 个文件被处理），patch 未生效，终止打补丁"
              tail -20 "$TMPD/apply-${CUR}-${NEXT_SUB}.log"
              exit 1
            fi
            rejected=$((rejected + n_fail))
            applied=$((applied + 1))
            # 更新版本号：SUBLEVEL 提到 NEXT_SUB（仅在补丁确实有 hunk 命中后）
            sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${NEXT_SUB}/" Makefile
            CUR="$NEXT"
          done
          echo "======================================"
          echo "打补丁完成: 应用 $applied 个版本，累计 FAILED hunk $rejected 个"
          echo "当前 Makefile 版本:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' Makefile
          REJFILES=$(find . -name '*.rej' 2>/dev/null | wc -l | tr -d ' ')
          echo ".rej 冲突文件总数: $REJFILES"
          {
            echo '### Linux 安全补丁同步结果'
            echo "- 基础版本: $BASE  →  目标: $LATEST"
            echo "- 应用补丁版本数: $applied"
            echo "- 累计 FAILED hunk: $rejected"
            echo "- .rej 文件数: $REJFILES"
            echo '- 说明: 冲突已 -f 生成 .rej 并跳过失败 hunk，仅做静态编译验证；能否刷入真机不保证'
            echo '```'
            find . -name '*.rej' 2>/dev/null | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 集成 SukiSU-Nova（builtin-new，CONFIG_KSU=y 内置）
        if: env.MANAGER != 'none'
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_sukisu.sh
          ./scripts/integrate_sukisu.sh "${KERNEL_PLATFORM}" "${MANAGER}" "${ENABLE_KPM}"
          # 关键验证：软链 / fragment / BUILD.bazel 注入 是否就位
          test -f "${KERNEL_PLATFORM}/common/drivers/kernelsu/Kconfig" || exit 1
          test -f "${KERNEL_PLATFORM}/common/drivers/kernelsu/Makefile" || exit 1
          # fragment 方案：CONFIG_KSU=y 在 ksu_defconfig fragment 里，gki_defconfig 本体必须干净
          test -f "${KERNEL_PLATFORM}/common/ksu_defconfig" || { echo "::error::缺 ksu_defconfig"; exit 1; }
          grep -q '^CONFIG_KSU=y' "${KERNEL_PLATFORM}/common/ksu_defconfig" || { echo "::error::fragment 缺 CONFIG_KSU=y"; exit 1; }
          if grep -q '^CONFIG_KSU=' "${KERNEL_PLATFORM}/common/arch/arm64/configs/gki_defconfig"; then
            echo "::error::gki_defconfig 被污染（含 CONFIG_KSU），Kleaf minimized 校验必失败"; exit 1;
          fi
          grep -q '"defconfig_fragments": \["ksu_defconfig"\]' "${KERNEL_PLATFORM}/common/BUILD.bazel" \
            || { echo "::error::BUILD.bazel 未注入 defconfig_fragments"; exit 1; }
          echo '==== ksu_defconfig fragment 内容 ===='
          cat "${KERNEL_PLATFORM}/common/ksu_defconfig"

      - name: 集成 SUSFS（susfs4ksu gki-android15-6.6，官方流程）
        if: env.MANAGER != 'none'
        run: |
          set -uo pipefail
          chmod +x scripts/integrate_susfs.sh
          ./scripts/integrate_susfs.sh "${KERNEL_PLATFORM}"

      - name: 编译 GKI 内核（Kleaf，只编需要的 target）
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          LOG="$GITHUB_WORKSPACE/build.log"
          ls -l tools/bazel || { echo "::error::缺少 tools/bazel"; exit 1; }
          T0=$(date +%s)
          # 只建三个 target（名字来自 kleaf common_kernels.bzl 的 define_common_kernels）：
          #   kernel_aarch64               -> Image（AnyKernel3 的负载）
          #   kernel_aarch64_gki_artifacts -> boot.img / gki-info.txt
          #   kernel_aarch64_images        -> system_dlkm.ext4.img / .erofs.img
          # 不建 kernel_aarch64_dist：uapi headers、ddk artifacts、headers archive、
          #   modules_install 拷贝、certification tools、init_ddk_zip、sbom、abi 全不生成
          tools/bazel build --config=fast \
            //common:kernel_aarch64 \
            //common:kernel_aarch64_gki_artifacts \
            //common:kernel_aarch64_images >>"$LOG" 2>&1 || {
            echo "::error::GKI 编译失败"
            { echo "### ❌ GKI 编译失败"; echo '```'
              grep -inE 'error|FAILED|fatal|Exception' "$LOG" | head -40; echo '```'
              echo '#### 末尾 60 行'; echo '```'; tail -60 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          T1=$(date +%s); echo "编译耗时 $((T1-T0))s"
          tail -15 "$LOG"

      - name: 严格 ABI/KMI 校验（STG 全类型图比对，只报告不阻断）
        if: env.STRICT_ABI_CHECK == 'true'
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          # Kleaf 官方 ABI 校验 target：把编译产物实际 ABI 与 android/abi_gki_aarch64.stg
          # 做 STG 全类型图精确 diff（符号缺失/结构体字段变化/枚举增删/字节大小变化都会报）。
          # exit code 非 0 = 检测到 ABI 变化（带 KSU+SUSFS 几乎必然非 0，属预期，不阻断）。
          echo "==> 运行 kleaf ABI 校验: //common:kernel_aarch64_abi_dist"
          ABILOG="$GITHUB_WORKSPACE/abi_check.log"
          if tools/bazel run --config=fast \
              //common:kernel_aarch64_abi_dist -- --destdir="$GITHUB_WORKSPACE/out_abi" \
              >"$ABILOG" 2>&1; then
            echo "  ✅ ABI 无变化（与 abi_gki_aarch64.stg 完全一致）"
          else
            echo "  ⚠ 检测到 ABI 变化（带 KSU/SUSFS 属预期，仅报告不阻断）"
          fi
          DIFF=$(find "$GITHUB_WORKSPACE/out_abi" -name 'abi.report*' -o -name 'abi_diff*' 2>/dev/null | head -1)
          {
            echo '### 严格 ABI/KMI 校验结果'
            echo '- 校验 target: //common:kernel_aarch64_abi_dist（STG 全类型图比对）'
            echo '- 参考定义: common/android/abi_gki_aarch64.stg'
            echo ''
            echo '```'
            grep -iE 'diff|break|added|removed|changed|error|symbol' "$ABILOG" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '==== ABI 校验日志末尾 40 行 ===='
          tail -40 "$ABILOG"

      - name: 取出产物（Image / boot.img / system_dlkm）
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          EXEC=$(tools/bazel info execution_root 2>/dev/null)
          echo "execroot=$EXEC"
          FILES=$(tools/bazel cquery --output=files \
            //common:kernel_aarch64 \
            //common:kernel_aarch64_gki_artifacts \
            //common:kernel_aarch64_images 2>/dev/null || true)
          echo '==== cquery 产物 ===='
          printf '%s\n' "$FILES" | head -40
          take() {
            n="$1"; src=""
            p=$(printf '%s\n' "$FILES" | grep -E "(^|/)$n\$" | head -1)
            if [ -n "$p" ]; then
              if [ -f "$p" ]; then src="$p"; else src="$EXEC/$p"; fi
            fi
            if [ ! -f "$src" ]; then
              src=$(find "$EXEC" -maxdepth 9 -type f -name "$n" -path '*kernel_aarch64*' 2>/dev/null | head -1)
            fi
            if [ -n "$src" ] && [ -f "$src" ]; then cp -v "$src" "$D/$n"; return 0; fi
            return 1
          }
          rc=0
          take Image || { echo "::error::没有产出 Image（AnyKernel3 必须有它）"; rc=1; }
          take boot.img || echo "::warning::没有 boot.img（仅备用，不影响 AnyKernel3）"
          take system_dlkm.ext4.img || echo "::warning::没有 system_dlkm.ext4.img"
          take system_dlkm.erofs.img || echo "::warning::没有 system_dlkm.erofs.img"
          [ "$rc" -eq 0 ] || exit 1
          # Image 必须是真 aarch64 内核：头 magic 在偏移 0x38，值 0x644d5241
          MAGIC=$(od -An -tx4 -j 56 -N 4 "$D/Image" 2>/dev/null | tr -d ' \n')
          echo "Image magic@0x38 = $MAGIC"
          [ "$MAGIC" = "644d5241" ] || { echo "::error::Image 头 magic 不是 644d5241，产物不对"; exit 1; }
          strings -a "$D/Image" 2>/dev/null | grep -m1 '^Linux version' || echo "::warning::Image 里没找到 Linux version 串"
          # ===== KSU 编入门禁（确定性断言，缺任一项即失败，绝不让没编进 KSU 的包流出）=====
          # 仅当 manager != none（即内置了 SukiSU-Nova）时才做此门禁。
          # manager=none 表示「不内置 root 的纯净 GKI」，本就不该出现 KSU 铁证串。
          if [ "$MANAGER" != "none" ]; then
          # 用 strings 查两个铁证串：它们只会在 SukiSU-Nova 源码被实际编译进内核后出现。
          #   1) welcome to KernelSU version   —— KSU 初始化欢迎串
          #   2) 当前 manager 的包名           —— 管理器包名（动态，随 manager 选项）
          # 注意：不再用「version 30007」之类的版本号串当铁证。SukiSU-Nova 的 KSU_VERSION
          #   是动态计算的（kernel/Makefile: VERSION_BASE=30000, VERSION_OFFSET=4001,
          #   KSU_VERSION = 30000 + commit数 - 4001，无计数时 = 41000），不存在固定值，
          #   写死任何数字都会误杀。前两个铁证（欢迎串 + 包名）已足以证明 SukiSU-Nova 编入。
          case "$MANAGER" in
            sukisu_nova) KSU_PKG_NAME="com.sukisu.nova" ;;
            *) echo "::error::未知 manager=$MANAGER，门禁无法确定包名"; exit 1;;
          esac
          STRINGS_TMP="$D/Image.strings"
          strings -a "$D/Image" > "$STRINGS_TMP"
          ksu_ok=0
          for needle in 'welcome to KernelSU version' "$KSU_PKG_NAME"; do
            if grep -qF "$needle" "$STRINGS_TMP"; then
              echo "  ✓ KSU 铁证命中: $needle"
            else
              echo "  ✗ KSU 铁证缺失: $needle"
              ksu_ok=1
            fi
          done
          rm -f "$STRINGS_TMP"
          if [ "$ksu_ok" -ne 0 ]; then
            echo "::error::Image 里没有检测到 SukiSU-Nova 已编入（上述铁证串缺失），拒绝继续打包"
            exit 1
          fi
          echo "  ✅ KSU 门禁通过：SukiSU-Nova 已确认编入 Image（manager=$MANAGER）"
          else
            echo "  ⏭ 跳过 KSU 门禁：manager=none（纯净 GKI，不内置 root）"
          fi
          INFO=$(find "$EXEC" -maxdepth 9 -type f -name 'gki-info.txt' -path '*kernel_aarch64*' 2>/dev/null | head -1)
          if [ -n "$INFO" ]; then echo '==== gki-info.txt ===='; cat "$INFO"; fi
          # ===== SUSFS 符号逐项核对（不是二值门禁，是 nm vmlinux 差集比对 + 详细缺失清单）=====
          if [ "$ENABLE_SUSFS" = "true" ] && [ "$MANAGER" != "none" ]; then
            echo "==== SUSFS 符号核对开始 ===="
            VMLINUX=$(find "$EXEC" -maxdepth 12 -type f -name 'vmlinux' 2>/dev/null | head -1)
            if [ -z "$VMLINUX" ] || [ ! -f "$VMLINUX" ]; then
              echo "  ⚠ 未在 execroot 找到 vmlinux，打印所有 vmlinux/System.map 候选路径以便下次校准："
              find "$EXEC" -maxdepth 12 -type f \( -name 'vmlinux' -o -name 'System.map' \) 2>/dev/null | head -20
              echo "  ⚠ 本次无法做符号核对（vmlinux 取样点未命中），不阻断，仅告警"
            else
              echo "  vmlinux = $VMLINUX"
              cp -v "$VMLINUX" "$D/vmlinux"
              EXPECT="$GITHUB_WORKSPACE/scripts/susfs_expected_symbols.txt"
              test -f "$EXPECT" || { echo "::error::缺期望符号清单 $EXPECT"; exit 1; }
              ACTUAL_TMP="$D/susfs_actual.syms"
              nm "$VMLINUX" 2>/dev/null | awk '$2 ~ /^[tTdDbBrR]$/ {print $3}' | grep '^susfs_' | sort -u > "$ACTUAL_TMP"
              actual_cnt=$(wc -l < "$ACTUAL_TMP")
              echo "  实际 susfs_* 符号数（nm vmlinux）: $actual_cnt"
              echo '  ---- 逐项核对 ----'
              miss=0
              while IFS= read -r sym; do
                case "$sym" in ''|\#*) continue;; esac
                if grep -qxF "$sym" "$ACTUAL_TMP"; then
                  echo "    ✓ $sym"
                else
                  echo "    ✗ 缺失 $sym"
                  miss=$((miss+1))
                fi
              done < "$EXPECT"
              echo "  ---- 缺失合计: $miss 个 ----"
              extra=$(comm -13 <(grep -E '^susfs_' "$EXPECT" | sort -u) "$ACTUAL_TMP")
              if [ -n "$extra" ]; then
                echo "  ---- 实际有但不在期望清单的 susfs_* 符号（供核对，非错误） ----"
                echo "$extra" | sed 's/^/    + /'
              fi
              rm -f "$ACTUAL_TMP"
              if [ "$miss" -gt 0 ]; then
                echo "::warning::SUSFS 符号缺失 $miss 个（详见上方清单），建议实机验证前人工复核"
              else
                echo "  ✅ SUSFS 符号核对通过：47 个期望符号全部命中"
              fi
            fi
            echo "==== SUSFS 符号核对结束 ===="
          fi
          ls -la "$D"

      - name: 集成 KernelPatch（KPM 加载器，enable_kpm=true 时才做）
        if: env.ENABLE_KPM == 'true' && env.MANAGER != 'none'
        run: |
          set -uo pipefail
          # kpimg 是 freestanding 裸机 ELF，必须 aarch64-none-elf 裸机交叉编译器
          # （不能用 gcc-aarch64-linux-gnu 代替）。apt 无此包，从 ARM 官方下载，
          # 只在 enable_kpm=true 时才下载，默认构建不白下载几百 MB。
          ARM_TC_VER="14.3.rel1"
          ARM_TC_DIR="/opt/arm-gnu-toolchain-${ARM_TC_VER}-x86_64-aarch64-none-elf"
          if [ ! -x "${ARM_TC_DIR}/bin/aarch64-none-elf-gcc" ]; then
            curl -fsSL \
              "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TC_VER}/binrel/arm-gnu-toolchain-${ARM_TC_VER}-x86_64-aarch64-none-elf.tar.xz" \
              -o /tmp/arm-gnu-toolchain.tar.xz
            sudo mkdir -p /opt
            sudo tar -xJf /tmp/arm-gnu-toolchain.tar.xz -C /opt
            rm -f /tmp/arm-gnu-toolchain.tar.xz
          fi
          export PATH="${ARM_TC_DIR}/bin:$PATH"
          aarch64-none-elf-gcc --version | head -1
          chmod +x scripts/integrate_kernelpatch.sh
          ./scripts/integrate_kernelpatch.sh "${KERNEL_PLATFORM}" "$GITHUB_WORKSPACE/dist/Image"

      - name: 打包 AnyKernel3 刷机包
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          D="$GITHUB_WORKSPACE/dist"
          test -f "$D/Image" || { echo "::error::dist/Image 不存在，无法打包"; exit 1; }
          rm -rf ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3 || {
            echo "::error::克隆 AnyKernel3 失败"; exit 1; }
          cd ak3
          rm -rf .git .github patch ramdisk modules
          test -f META-INF/com/google/android/update-binary || { echo "::error::AK3 模板缺 update-binary"; exit 1; }
          test -f tools/ak3-core.sh || { echo "::error::AK3 模板缺 tools/ak3-core.sh"; exit 1; }

          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ### AAK-AN00 (HONOR WIN RT) - 自编译 GKI (android15-6.6 / 6.6.56)
          ### 本机形态：A/B 槽；boot.img 为 header v4 且无 ramdisk（ramdisk 在 init_boot）。
          ### 因此只做「拆 boot -> 换内核 -> 回写」，不碰 ramdisk、不碰 init_boot、不碰 recovery。
          properties() { '
          kernel.string=AAK-AN00 GKI 6.6.56 (self-built)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=AAK-AN00
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # 只写活动槽：ak3-core.sh 的 setup_ak 里有「/postinstall/tmp 是目录且未指定
          # SLOT_SELECT 时自动翻成 inactive」的分支，OTA 暂存目录一出现就会写进另一槽。
          SLOT_SELECT=active;

          # boot 用分区名而非写死路径：名字模式下 AK3 会依次试 by-name /
          # bootdevice/by-name / platform/*/by-name / /dev/$part 多条候选。
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;

          # ---- 写入前三道自检（source 时 setup_ak 已解析出 BLOCK / SLOT）----
          case "$SLOT" in
            _a|_b) : ;;
            *) abort "活动槽异常（SLOT='$SLOT'），拒绝刷写。";;
          esac
          [ -n "$BLOCK" ] || abort "未能确定目标分区，拒绝刷写。"
          [ -b "$BLOCK" ] || ui_print "  ⚠ 目标节点非常规块设备（$BLOCK），继续尝试"
          ui_print "  活动槽：$SLOT"
          ui_print "  目标分区：$BLOCK"

          split_boot;
          flash_boot;
          AK3

          cp "$D/Image" ./Image
          chmod +x tools/* 2>/dev/null || true

          # ===== 许可证合规：把仓库根的许可证/声明文件随包分发 =====
          # GPL-2.0（内核主体 + SukiSU-Nova）、GPL-3.0（susfs4ksu）、BSD-3-Clause（AnyKernel3）、
          # Apache-2.0（kernel/build 工具链）的全文与逐项 NOTICE 声明必须进刷机包，
          # 才能满足「随二进制分发须附带许可证文本」的义务。纯文本文件，不影响刷写与成败。
          cp -v "$GITHUB_WORKSPACE/LICENSE" ./LICENSE
          cp -v "$GITHUB_WORKSPACE/NOTICE.md" ./NOTICE.md
          mkdir -p ./LICENSES
          cp -v "$GITHUB_WORKSPACE"/LICENSES/*.txt ./LICENSES/
          echo '==== 许可证文件已入包 ===='
          ls -l LICENSE NOTICE.md LICENSES/

          echo '==== 包内根目录 ===='
          ls -l anykernel.sh Image
          bash -n anykernel.sh || { echo "::error::anykernel.sh 语法错误"; exit 1; }
          for chk in 'SLOT_SELECT=active;' 'BLOCK=boot;' 'IS_SLOT_DEVICE=1;' 'PATCH_VBMETA_FLAG=auto;'; do
            grep -qF "$chk" anykernel.sh || { echo "::error::anykernel.sh 缺约束：$chk"; exit 1; }
          done
          grep -qF 'split_boot;' anykernel.sh && grep -qF 'flash_boot;' anykernel.sh \
            || { echo "::error::anykernel.sh 缺 split_boot/flash_boot"; exit 1; }

          ZIP="$D/AAK-AN00-GKI-AnyKernel3-$GITHUB_RUN_NUMBER.zip"
          rm -f "$ZIP"
          zip -r9 "$ZIP" . -x '*.git*' >/dev/null || { echo "::error::zip 失败"; exit 1; }
          echo '==== zip 目录结构 ===='
          unzip -l "$ZIP" | head -30
          unzip -l "$ZIP" | grep -q 'anykernel.sh' || { echo "::error::zip 缺 anykernel.sh"; exit 1; }
          unzip -l "$ZIP" | grep -q 'META-INF/com/google/android/update-binary' || { echo "::error::zip 缺 update-binary"; exit 1; }
          unzip -l "$ZIP" | grep -q 'tools/ak3-core.sh' || { echo "::error::zip 缺 tools/ak3-core.sh"; exit 1; }
          unzip -l "$ZIP" | grep -qE ' Image$' || { echo "::error::zip 缺 Image"; exit 1; }
          # ===== 许可证合规门禁：确认许可证/声明文件已进包 =====
          for f in 'LICENSE' 'NOTICE.md' 'LICENSES/GPL-2.0.txt' 'LICENSES/GPL-3.0.txt' 'LICENSES/Apache-2.0.txt'; do
            unzip -l "$ZIP" | grep -qE "[[:space:]]$f$" || { echo "::error::zip 缺许可证文件 $f"; exit 1; }
            echo "  ✓ 许可证文件在包内: $f"
          done
          ls -lh "$ZIP"
          {
            echo '### AnyKernel3 刷机包'
            echo '```'
            unzip -l "$ZIP" | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传刷机包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAK-AN00-GKI-AnyKernel3
          path: |
            dist/*.zip
            dist/system_dlkm.ext4.img
            dist/system_dlkm.erofs.img
            dist/vmlinux
          if-no-files-found: warn

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: build.log
          if-no-files-found: warn