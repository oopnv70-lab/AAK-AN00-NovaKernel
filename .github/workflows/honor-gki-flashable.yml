name: 荣耀GKI可刷镜像 (android15-6.6)

# 目标：用荣耀开源 common（android15-6.6）编出【可直接刷机】的 GKI 分区镜像。
#   - 只产出 boot.img + system_dlkm(img) 两个分区镜像，不参杂 .ko / 头文件 / sbom / vmlinux 等。
#   - boot.img 刷 boot 分区；system_dlkm.*.img 刷 system_dlkm 分区（自编 GKI 模块）。
#
# 构建预算约束（重要）：Kleaf 全量 GKI 在 2 核 runner 约 40+ 分钟。
#   → 不要为看排版/试流程反复触发；只在真正要出成品时跑。
#   → 日常「改动能不能编过」请用 make 出裸 Image（见主分支 workflow 的 make 路线）。
#
# 现实边界：自编译 GKI 未用 Google 私钥签名，且公开源码 6.6.56 ≠ 真机 6.6.89，
#   AVB/vermagic 与真机固件不匹配时刷入也开不了机；本分支只是产出「形态正确、可直接 fastboot flash」
#   的分区镜像，供解锁后/固件对齐后使用。

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Honor 型号代号（= 源码包文件名前缀）'
        required: true
        default: 'AAK-AN00'

concurrency:
  group: honor-gki-flashable
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL: ${{ github.event.inputs.model || 'AAK-AN00' }}
  BRANCH: common-android15-6.6
  KP_DIR: ${{ github.workspace }}/kp

jobs:
  build:
    name: 荣耀GKI可刷镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools libxml2-utils

      - name: 记录运行机指纹
        run: |
          set -uo pipefail
          echo "nproc=$(nproc)"; grep -m1 'model name' /proc/cpuinfo || true
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || true; df -h / | tail -1

      - name: 安装 repo 同步工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 拉取荣耀开源代码 (${{ env.MODEL }})
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      - name: 同步 AOSP 内核基础工程 (${{ env.BRANCH }})
        run: |
          set -euxo pipefail
          mkdir -p "$KP_DIR"; cd "$KP_DIR"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1 --no-repo-verify
          repo sync -c --no-tags --optimized-fetch -j"$(nproc)" --force-sync
          if [ -d "$KP_DIR/kernel_platform/common" ]; then ROOT="$KP_DIR/kernel_platform"; else ROOT="$KP_DIR"; fi
          echo "KERNEL_PLATFORM=$ROOT" >> "$GITHUB_ENV"
          echo "识别到内核工程根目录: $ROOT"
          test -d "$ROOT/common" || { echo "::error::找不到 $ROOT/common"; exit 1; }
          du -sh "$KP_DIR"; df -h /

      - name: 用荣耀源码覆盖 common 内核目录
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          test -d "${KERNEL_PLATFORM}/common" || { echo "::error::common 不存在"; exit 1; }
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          miss=0
          for f in Makefile Kbuild BUILD.bazel build.config.gki.aarch64 arch/arm64/configs/gki_defconfig; do
            [ -e "${KERNEL_PLATFORM}/common/$f" ] && echo "  ✓ $f" || { echo "  ✗ $f"; miss=1; }
          done
          [ "$miss" -eq 0 ] || { echo "::error::覆盖后 common/ 缺关键文件"; exit 1; }

      - name: 编译并打包 GKI（Kleaf dist）
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          LOG="$GITHUB_WORKSPACE/build.log"; DIST="$GITHUB_WORKSPACE/dist"; mkdir -p "$DIST"
          ls -l tools/bazel || { echo "::error::缺少 tools/bazel"; exit 1; }
          T0=$(date +%s)
          tools/bazel run --config=fast //common:kernel_aarch64_dist -- --dist_dir="$DIST" >>"$LOG" 2>&1 || {
            echo "::error::Kleaf 构建/打包失败"
            { echo "### ❌ Kleaf 失败"; echo '```'
              grep -inE 'error|FAILED|fatal|Exception|ERROR' "$LOG" | head -40; echo '```'
              echo '#### 末尾 60 行'; echo '```'; tail -60 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          T1=$(date +%s); echo "构建+打包耗时 $((T1-T0))s"
          ls -la "$DIST" | head -40

      - name: 只保留可刷机镜像
        run: |
          set -uo pipefail
          D="$GITHUB_WORKSPACE/dist"; F="$GITHUB_WORKSPACE/flash"; mkdir -p "$F"
          need_fail=0
          # boot.img 必要
          if [ -f "$D/boot.img" ]; then cp -v "$D/boot.img" "$F/"; else echo "::error::缺 boot.img"; need_fail=1; fi
          # system_dlkm：ext4 / erofs 两种文件系统都给（设备用哪个刷哪个），有就带、没有不致命
          for n in system_dlkm.ext4.img system_dlkm.erofs.img; do
            if [ -f "$D/$n" ]; then cp -v "$D/$n" "$F/"; else echo "::warning::缺 $n"; fi
          done
          [ "$need_fail" -eq 0 ] || exit 1

          REL=$(sed -n 's/^kernel_release=//p' "$D/gki-info.txt" 2>/dev/null | head -1)
          [ -z "$REL" ] && REL="unknown"
          {
            echo "Honor GKI 可刷镜像"
            echo "型号: ${MODEL}"
            echo "kernel_release: ${REL}"
            echo "构建: run ${GITHUB_RUN_ID}  commit ${GITHUB_SHA}"
            echo
            echo "== 刷机（fastboot）=="
            echo "fastboot flash boot boot.img"
            echo "fastboot flash system_dlkm system_dlkm.ext4.img   # 或 system_dlkm.erofs.img（按设备分区文件系统选）"
            echo
            echo "== 注意 =="
            echo "1) 自编译 GKI 未用 Google 私钥签名，AVB 校验可能拒绝；需解锁 BL / 关闭校验。"
            echo "2) 公开源码为 6.6.56，若真机固件内核版本不同（如 6.6.89），vermagic 不匹配，刷入无法开机。"
            echo "3) boot.img 只含内核；ramdisk 在 init_boot，本包不改 init_boot。"
          } > "$F/README.txt"
          ( cd "$F" && sha256sum * > SHA256SUMS.txt 2>/dev/null || true )
          echo "==== 可刷镜像清单 ===="
          ls -la "$F"
          {
            echo "### 可刷镜像"
            echo '```'
            ls -la "$F"
            echo '```'
            echo "- kernel_release: \`${REL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传可刷镜像
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 可刷GKI-${{ env.MODEL }}
          path: flash/*
          if-no-files-found: warn

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: build.log
          if-no-files-found: warn