name: 荣耀GKI AnyKernel3 刷机包 (android15-6.6)

# 目标：用荣耀开源 common（android15-6.6）编出【可直接刷机】的 GKI 分区镜像。
#   - 只产出 boot.img + system_dlkm(img) 两个分区镜像，不参杂 .ko / 头文件 / sbom / vmlinux 等。
#   - boot.img 刷 boot 分区；system_dlkm.*.img 刷 system_dlkm 分区（自编 GKI 模块）。
#
# 构建预算约束（重要）：Kleaf 全量 GKI 在 2 核 runner 约 40+ 分钟。
#   → 不要为看排版/试流程反复触发；只在真正要出成品时跑。
#   → 日常「改动能不能编过」请用 make 出裸 Image（见主分支 workflow 的 make 路线）。
#
# 现实边界：自编译 GKI 未用 Google 私钥签名，且公开源码 6.6.56 ≠ 真机 6.6.89，
#   AVB/vermagic 与真机固件不匹配时刷入也开不了机；本分支只是产出「形态正确、可直接 fastboot flash」
#   的分区镜像，供解锁后/固件对齐后使用。

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Honor 型号代号（= 源码包文件名前缀）'
        required: true
        default: 'AAK-AN00'

concurrency:
  group: honor-gki-flashable
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL: ${{ github.event.inputs.model || 'AAK-AN00' }}
  BRANCH: common-android15-6.6
  KP_DIR: ${{ github.workspace }}/kp

jobs:
  build:
    name: 荣耀GKI可刷镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools libxml2-utils

      - name: 记录运行机指纹
        run: |
          set -uo pipefail
          echo "nproc=$(nproc)"; grep -m1 'model name' /proc/cpuinfo || true
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || true; df -h / | tail -1

      - name: 安装 repo 同步工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 拉取荣耀开源代码 (${{ env.MODEL }})
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      - name: 同步 AOSP 内核基础工程 (${{ env.BRANCH }})
        run: |
          set -euxo pipefail
          mkdir -p "$KP_DIR"; cd "$KP_DIR"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1 --no-repo-verify
          repo sync -c --no-tags --optimized-fetch -j"$(nproc)" --force-sync
          if [ -d "$KP_DIR/kernel_platform/common" ]; then ROOT="$KP_DIR/kernel_platform"; else ROOT="$KP_DIR"; fi
          echo "KERNEL_PLATFORM=$ROOT" >> "$GITHUB_ENV"
          echo "识别到内核工程根目录: $ROOT"
          test -d "$ROOT/common" || { echo "::error::找不到 $ROOT/common"; exit 1; }
          du -sh "$KP_DIR"; df -h /

      - name: 用荣耀源码覆盖 common 内核目录
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          test -d "${KERNEL_PLATFORM}/common" || { echo "::error::common 不存在"; exit 1; }
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          miss=0
          for f in Makefile Kbuild BUILD.bazel build.config.gki.aarch64 arch/arm64/configs/gki_defconfig; do
            [ -e "${KERNEL_PLATFORM}/common/$f" ] && echo "  ✓ $f" || { echo "  ✗ $f"; miss=1; }
          done
          [ "$miss" -eq 0 ] || { echo "::error::覆盖后 common/ 缺关键文件"; exit 1; }

      - name: 集成 SukiSU-Nova（builtin-new，CONFIG_KSU=y 内置）
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_sukisu.sh
          ./scripts/integrate_sukisu.sh "${KERNEL_PLATFORM}"
          # 关键验证：软链 / fragment / BUILD.bazel 注入 是否就位
          test -f "${KERNEL_PLATFORM}/common/drivers/kernelsu/Kconfig" || exit 1
          test -f "${KERNEL_PLATFORM}/common/drivers/kernelsu/Makefile" || exit 1
          # fragment 方案：CONFIG_KSU=y 在 ksu_defconfig fragment 里，gki_defconfig 本体必须干净
          test -f "${KERNEL_PLATFORM}/common/ksu_defconfig" || { echo "::error::缺 ksu_defconfig"; exit 1; }
          grep -q '^CONFIG_KSU=y' "${KERNEL_PLATFORM}/common/ksu_defconfig" || { echo "::error::fragment 缺 CONFIG_KSU=y"; exit 1; }
          if grep -q '^CONFIG_KSU=' "${KERNEL_PLATFORM}/common/arch/arm64/configs/gki_defconfig"; then
            echo "::error::gki_defconfig 被污染（含 CONFIG_KSU），Kleaf minimized 校验必失败"; exit 1;
          fi
          grep -q '"defconfig_fragments": \["ksu_defconfig"\]' "${KERNEL_PLATFORM}/common/BUILD.bazel" \
            || { echo "::error::BUILD.bazel 未注入 defconfig_fragments"; exit 1; }
          echo '==== ksu_defconfig fragment 内容 ===='
          cat "${KERNEL_PLATFORM}/common/ksu_defconfig"

      - name: 编译 GKI 内核（Kleaf，只编需要的 target）
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          LOG="$GITHUB_WORKSPACE/build.log"
          ls -l tools/bazel || { echo "::error::缺少 tools/bazel"; exit 1; }
          T0=$(date +%s)
          # 只建三个 target（名字来自 kleaf common_kernels.bzl 的 define_common_kernels）：
          #   kernel_aarch64               -> Image（AnyKernel3 的负载）
          #   kernel_aarch64_gki_artifacts -> boot.img / gki-info.txt
          #   kernel_aarch64_images        -> system_dlkm.ext4.img / .erofs.img
          # 不建 kernel_aarch64_dist：uapi headers、ddk artifacts、headers archive、
          #   modules_install 拷贝、certification tools、init_ddk_zip、sbom、abi 全不生成
          tools/bazel build --config=fast \
            //common:kernel_aarch64 \
            //common:kernel_aarch64_gki_artifacts \
            //common:kernel_aarch64_images >>"$LOG" 2>&1 || {
            echo "::error::GKI 编译失败"
            { echo "### ❌ GKI 编译失败"; echo '```'
              grep -inE 'error|FAILED|fatal|Exception' "$LOG" | head -40; echo '```'
              echo '#### 末尾 60 行'; echo '```'; tail -60 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          T1=$(date +%s); echo "编译耗时 $((T1-T0))s"
          tail -15 "$LOG"

      - name: 取出产物（Image / boot.img / system_dlkm）
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          EXEC=$(tools/bazel info execution_root 2>/dev/null)
          echo "execroot=$EXEC"
          FILES=$(tools/bazel cquery --output=files \
            //common:kernel_aarch64 \
            //common:kernel_aarch64_gki_artifacts \
            //common:kernel_aarch64_images 2>/dev/null || true)
          echo '==== cquery 产物 ===='
          printf '%s\n' "$FILES" | head -40
          take() {
            n="$1"; src=""
            p=$(printf '%s\n' "$FILES" | grep -E "(^|/)$n\$" | head -1)
            if [ -n "$p" ]; then
              if [ -f "$p" ]; then src="$p"; else src="$EXEC/$p"; fi
            fi
            if [ ! -f "$src" ]; then
              src=$(find "$EXEC" -maxdepth 9 -type f -name "$n" -path '*kernel_aarch64*' 2>/dev/null | head -1)
            fi
            if [ -n "$src" ] && [ -f "$src" ]; then cp -v "$src" "$D/$n"; return 0; fi
            return 1
          }
          rc=0
          take Image || { echo "::error::没有产出 Image（AnyKernel3 必须有它）"; rc=1; }
          take boot.img || echo "::warning::没有 boot.img（仅备用，不影响 AnyKernel3）"
          take system_dlkm.ext4.img || echo "::warning::没有 system_dlkm.ext4.img"
          take system_dlkm.erofs.img || echo "::warning::没有 system_dlkm.erofs.img"
          [ "$rc" -eq 0 ] || exit 1
          # Image 必须是真 aarch64 内核：头 magic 在偏移 0x38，值 0x644d5241
          MAGIC=$(od -An -tx4 -j 56 -N 4 "$D/Image" 2>/dev/null | tr -d ' \n')
          echo "Image magic@0x38 = $MAGIC"
          [ "$MAGIC" = "644d5241" ] || { echo "::error::Image 头 magic 不是 644d5241，产物不对"; exit 1; }
          strings -a "$D/Image" 2>/dev/null | grep -m1 '^Linux version' || echo "::warning::Image 里没找到 Linux version 串"
          INFO=$(find "$EXEC" -maxdepth 9 -type f -name 'gki-info.txt' -path '*kernel_aarch64*' 2>/dev/null | head -1)
          if [ -n "$INFO" ]; then echo '==== gki-info.txt ===='; cat "$INFO"; fi
          ls -la "$D"

      - name: 打包 AnyKernel3 刷机包
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          D="$GITHUB_WORKSPACE/dist"
          test -f "$D/Image" || { echo "::error::dist/Image 不存在，无法打包"; exit 1; }
          rm -rf ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3 || {
            echo "::error::克隆 AnyKernel3 失败"; exit 1; }
          cd ak3
          rm -rf .git .github patch ramdisk modules
          test -f META-INF/com/google/android/update-binary || { echo "::error::AK3 模板缺 update-binary"; exit 1; }
          test -f tools/ak3-core.sh || { echo "::error::AK3 模板缺 tools/ak3-core.sh"; exit 1; }

          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ### AAK-AN00 (HONOR WIN RT) - 自编译 GKI (android15-6.6 / 6.6.56)
          ### 本机形态：A/B 槽；boot.img 为 header v4 且无 ramdisk（ramdisk 在 init_boot）。
          ### 因此只做「拆 boot -> 换内核 -> 回写」，不碰 ramdisk、不碰 init_boot、不碰 recovery。
          properties() { '
          kernel.string=AAK-AN00 GKI 6.6.56 (self-built)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=AAK-AN00
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # 只写活动槽：ak3-core.sh 的 setup_ak 里有「/postinstall/tmp 是目录且未指定
          # SLOT_SELECT 时自动翻成 inactive」的分支，OTA 暂存目录一出现就会写进另一槽。
          SLOT_SELECT=active;

          # boot 用分区名而非写死路径：名字模式下 AK3 会依次试 by-name /
          # bootdevice/by-name / platform/*/by-name / /dev/$part 多条候选。
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;

          # ---- 写入前三道自检（source 时 setup_ak 已解析出 BLOCK / SLOT）----
          case "$SLOT" in
            _a|_b) : ;;
            *) abort "活动槽异常（SLOT='$SLOT'），拒绝刷写。";;
          esac
          [ -n "$BLOCK" ] || abort "未能确定目标分区，拒绝刷写。"
          [ -b "$BLOCK" ] || ui_print "  ⚠ 目标节点非常规块设备（$BLOCK），继续尝试"
          ui_print "  活动槽：$SLOT"
          ui_print "  目标分区：$BLOCK"

          split_boot;
          flash_boot;

          # ---- 写后回读自证：把分区 kernel 段读回来，与包内 Image 比 md5 ----
          # header v3/v4 无 page_size 字段，kernel 固定从 4096 开始；v0-2 才读 @36 的 page_size。
          verify_kernel_write() {
            if ! command -v od >/dev/null 2>&1 || ! command -v md5sum >/dev/null 2>&1; then
              ui_print "  （环境缺 od/md5sum，回读校验跳过）"
              return 0
            fi
            MAGIC=$(dd if="$BLOCK" bs=1 count=8 2>/dev/null)
            if [ "$MAGIC" != "ANDROID!" ]; then
              ui_print "  （头部非 ANDROID!，不是 boot 镜像，回读校验跳过）"
              return 0
            fi
            HV=$(od -An -tu4 -j 40 -N 4 "$BLOCK" 2>/dev/null | tr -d ' \n')
            KS=$(od -An -tu4 -j 8 -N 4 "$BLOCK" 2>/dev/null | tr -d ' \n')
            case "$KS" in
              ''|*[!0-9]*) ui_print "  （读不到 kernel_size，回读校验跳过）"; return 0;;
            esac
            if [ "$KS" -gt 268435456 ]; then
              ui_print "  （kernel_size=$KS 不合理，回读校验跳过）"
              return 0
            fi
            KOF=4096
            case "$HV" in
              ''|*[!0-9]*) : ;;
              *) if [ "$HV" -lt 3 ]; then KOF=$(od -An -tu4 -j 36 -N 4 "$BLOCK" 2>/dev/null | tr -d ' \n'); fi;;
            esac
            case "$KOF" in ''|0|*[!0-9]*) KOF=4096;; esac
            SZ=$(wc -c < Image | tr -d ' ')
            [ "$SZ" = "$KS" ] || ui_print "  ⚠ 分区内 kernel 段 $KS 字节，包内 Image $SZ 字节（大小不一致）"
            CNT=$(( (KS + KOF - 1) / KOF ))
            GOT=$(dd if="$BLOCK" bs=$KOF skip=1 count=$CNT 2>/dev/null | head -c "$KS" | md5sum | cut -d' ' -f1)
            WANT=$(md5sum Image | cut -d' ' -f1)
            if [ "$GOT" = "$WANT" ]; then
              ui_print "  ✅ 回读校验通过：$BLOCK kernel 段 $KS 字节，md5 与包内 Image 一致"
              ui_print "     md5=$WANT"
            else
              ui_print "  ❌ 回读校验不一致：expect=$WANT got=$GOT"
              ui_print "     请勿依赖本次启动；回退用 fastboot flash boot$SLOT <原厂 boot.img>"
            fi
          }
          verify_kernel_write;
          AK3

          cp "$D/Image" ./Image
          chmod +x tools/* 2>/dev/null || true

          echo '==== 包内根目录 ===='
          ls -l anykernel.sh Image
          bash -n anykernel.sh || { echo "::error::anykernel.sh 语法错误"; exit 1; }
          for chk in 'SLOT_SELECT=active;' 'BLOCK=boot;' 'IS_SLOT_DEVICE=1;' 'PATCH_VBMETA_FLAG=auto;' 'verify_kernel_write;'; do
            grep -qF "$chk" anykernel.sh || { echo "::error::anykernel.sh 缺约束：$chk"; exit 1; }
          done
          grep -qF 'split_boot;' anykernel.sh && grep -qF 'flash_boot;' anykernel.sh \
            || { echo "::error::anykernel.sh 缺 split_boot/flash_boot"; exit 1; }

          ZIP="$D/AAK-AN00-GKI-AnyKernel3-$GITHUB_RUN_NUMBER.zip"
          rm -f "$ZIP"
          zip -r9 "$ZIP" . -x '*.git*' >/dev/null || { echo "::error::zip 失败"; exit 1; }
          echo '==== zip 目录结构 ===='
          unzip -l "$ZIP" | head -30
          unzip -l "$ZIP" | grep -q 'anykernel.sh' || { echo "::error::zip 缺 anykernel.sh"; exit 1; }
          unzip -l "$ZIP" | grep -q 'META-INF/com/google/android/update-binary' || { echo "::error::zip 缺 update-binary"; exit 1; }
          unzip -l "$ZIP" | grep -q 'tools/ak3-core.sh' || { echo "::error::zip 缺 tools/ak3-core.sh"; exit 1; }
          unzip -l "$ZIP" | grep -qE ' Image$' || { echo "::error::zip 缺 Image"; exit 1; }
          ls -lh "$ZIP"
          {
            echo '### AnyKernel3 刷机包'
            echo '```'
            unzip -l "$ZIP" | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传刷机包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAK-AN00-GKI-AnyKernel3
          path: |
            dist/*.zip
            dist/system_dlkm.ext4.img
            dist/system_dlkm.erofs.img
          if-no-files-found: warn

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: build.log
          if-no-files-found: warn