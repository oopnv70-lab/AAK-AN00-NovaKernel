name: 荣耀GKI编译与打包 (android15-6.6)

# 目标：把荣耀开源包里的 kernel/（= AOSP common android15-6.6）纯 GKI 编译 + 打包。
# 不带 KSU 管理器、不带 SUSFS/KPM/BBG 等任何特殊开关：就是原厂 gki_defconfig。
#
# 为什么默认 Kleaf(Bazel) 而不是 make：
#   AOSP 官方《构建内核》明确写「Android 14 及更高版本不支持 build.sh」。
#   Android 15 唯一官方 GKI 打包路径是：
#       tools/bazel run //common:kernel_aarch64_dist -- --destdir=DIST
#   它才会产出 GKI 的 boot.img / system_dlkm.img / Image / System.map / vmlinux。
#   `make all` 只能编出裸 Image，不会打包成 GKI。
#   （make 仍保留为 build_system=make 选项，仅用于快速验证「能编出 Image」。）
#
# 手动触发；并发去重。

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Honor model code (= source zip 文件名前缀)'
        required: true
        default: 'AAK-AN00'
      build_system:
        description: 'kleaf=官方GKI打包(boot.img/system_dlkm)；make=只编裸Image'
        required: true
        default: 'kleaf'
        type: choice
        options: ['kleaf', 'make']

concurrency:
  group: honor-gki-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL: ${{ github.event.inputs.model || 'AAK-AN00' }}
  BUILD_SYSTEM: ${{ github.event.inputs.build_system || 'kleaf' }}
  BRANCH: common-android15-6.6
  KP_DIR: ${{ github.workspace }}/kp

jobs:
  build:
    name: 荣耀GKI构建
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools libxml2-utils

      - name: 记录运行机指纹
        run: |
          set -uo pipefail
          echo "nproc=$(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
          df -h / | tail -1

      - name: 安装 repo 同步工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/repo --version

      - name: 准备编译缓存（make 路线用）
        if: env.BUILD_SYSTEM == 'make'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-honor-${{ env.MODEL }}-${{ github.run_id }}
          restore-keys: |
            ccache-honor-${{ env.MODEL }}-
            ccache-honor-

      # 1) 拉荣耀源码（脚本实时取有效签名URL + 带Referer下载 + 解压）
      - name: 拉取荣耀开源代码 (${{ env.MODEL }})
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      # 2) AOSP kernel manifest（提供 build/、prebuilts/clang、prebuilts/bazel、tools/bazel）
      - name: 同步 AOSP 内核基础工程 (${{ env.BRANCH }})
        run: |
          set -euxo pipefail
          mkdir -p "$KP_DIR"
          cd "$KP_DIR"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "$BRANCH" --depth=1 --no-repo-verify
          repo sync -c --no-tags --optimized-fetch -j"$(nproc)" --force-sync
          echo "==== 拉取结果 ===="
          ls -la "$KP_DIR"
          # AOSP kernel/manifest 直接把 common/build/prebuilts/tools 同步到当前目录(根下)；
          # 只有 OnePlusOSS 这类 manifest 才多套一层 kernel_platform/。这里自动判别，避免写死。
          if [ -d "$KP_DIR/kernel_platform/common" ]; then
            ROOT="$KP_DIR/kernel_platform"
          else
            ROOT="$KP_DIR"
          fi
          echo "KERNEL_PLATFORM=$ROOT" >> "$GITHUB_ENV"
          echo "识别到内核工程根目录: $ROOT"
          test -d "$ROOT/common" || { echo "::error::找不到 $ROOT/common（manifest 拉取结构异常）"; exit 1; }
          ls -la "$ROOT" | head -30
          du -sh "$KP_DIR"
          df -h /

      # 3) 用荣耀 kernel/ 覆盖 common/
      - name: 用荣耀源码覆盖 common 内核目录
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          test -d "${KERNEL_PLATFORM}/common" || { echo "::error::kernel_platform/common 不存在（manifest 分支可能不对）"; exit 1; }
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          # ---- 覆盖后硬校验：--delete 有风险，必须要的关键文件缺一个就当场失败，别等到 bazel 跑一半才炸 ----
          miss=0
          for f in Makefile Kbuild BUILD.bazel build.config.gki.aarch64 \
                   arch/arm64/configs/gki_defconfig; do
            if [ -e "${KERNEL_PLATFORM}/common/$f" ]; then echo "  ✓ common/$f"; else echo "  ✗ common/$f"; miss=1; fi
          done
          [ "$miss" -eq 0 ] || { echo "::error::覆盖后 common/ 缺关键文件（荣耀压缩包结构可能变了）"; ls -la "${KERNEL_PLATFORM}/common" | head; exit 1; }
          echo "==== 内核版本 ===="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' "${KERNEL_PLATFORM}/common/Makefile"
          echo "==== build.config.common ===="
          grep -E 'BRANCH|KMI_GENERATION|CLANG_VERSION' "${KERNEL_PLATFORM}/common/build.config.common" || true
          echo "==== build.config.gki.aarch64 ===="
          cat "${KERNEL_PLATFORM}/common/build.config.gki.aarch64" 2>/dev/null || true

      # 4a) Kleaf 三步：①编译内核 ②校验并收集 ③打包 GKI（顺序与参考项目一致）
      - name: 编译内核（Kleaf build）
        if: env.BUILD_SYSTEM == 'kleaf'
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "==== tools/bazel 存在性 ===="
          ls -l tools/bazel || { echo "::error::缺少 tools/bazel（manifest 不对？）"; exit 1; }
          T0=$(date +%s)
          tools/bazel build --config=fast //common:kernel_aarch64 >>"$LOG" 2>&1 || {
            echo "::error::内核编译失败（Kleaf build）"
            { echo "### ❌ 内核编译失败"; echo '```'
              grep -inE 'error|FAILED|fatal|Exception|ERROR' "$LOG" | head -40
              echo '```'; echo "#### 末尾 60 行"; echo '```'; tail -60 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -inE 'error|FAILED|fatal' "$LOG" | head -15 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1; }
          T1=$(date +%s); echo "编译耗时 $((T1-T0))s"
          tail -15 "$LOG"

      - name: 校验并收集产物
        if: env.BUILD_SYSTEM == 'kleaf'
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          DIST="$GITHUB_WORKSPACE/dist"; mkdir -p "$DIST"
          KB="$KERNEL_PLATFORM/bazel-bin/common/kernel_aarch64"
          echo "==== 校验 Image ===="
          IMG=$(find "$KB" -maxdepth 3 \( -type f -o -type l \) -name Image -print -quit 2>/dev/null || true)
          [ -z "$IMG" ] && IMG=$(find "$KERNEL_PLATFORM/bazel-bin" -maxdepth 8 \( -type f -o -type l \) -name Image -print -quit 2>/dev/null || true)
          [ -z "$IMG" ] && { echo "::error::没找到 Image，编译未产出内核"; ls -la "$KB" 2>/dev/null | head; exit 1; }
          cp -Lv "$IMG" "$DIST/Image"
          echo "Image: $(du -h "$DIST/Image" | cut -f1)  (来自 $IMG)"
          for f in System.map vmlinux; do
            p=$(find "$KB" -maxdepth 3 \( -type f -o -type l \) -name "$f" -print -quit 2>/dev/null || true)
            [ -z "$p" ] && p=$(find "$KERNEL_PLATFORM/bazel-bin" -maxdepth 8 \( -type f -o -type l \) -name "$f" -print -quit 2>/dev/null || true)
            if [ -n "$p" ]; then cp -Lv "$p" "$DIST/"; else echo "::warning::未找到 $f"; fi
          done
          ls -la "$DIST"

      - name: 打包 GKI 镜像（Kleaf dist）
        if: env.BUILD_SYSTEM == 'kleaf'
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          LOG="$GITHUB_WORKSPACE/build.log"
          DIST="$GITHUB_WORKSPACE/dist"; mkdir -p "$DIST"
          T0=$(date +%s)
          # dist 目录参数官方有两种写法（--destdir / --dist_dir），不赌：先用 --dist_dir，失败则无参重跑
          rc=0
          tools/bazel run --config=fast //common:kernel_aarch64_dist -- --dist_dir="$DIST" >>"$LOG" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && grep -qiE "dist_dir|Unrecognized option|no such attribute" "$LOG"; then
            echo "::warning::--dist_dir 不被接受，改为不带 dist 参数重跑（复用缓存）"
            rc=0; tools/bazel run --config=fast //common:kernel_aarch64_dist >>"$LOG" 2>&1 || rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::GKI 打包失败"
            grep -inE 'error|FAILED|fatal' "$LOG" | head -15 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            tail -40 "$LOG"; exit 1
          fi
          T1=$(date +%s); echo "打包耗时 $((T1-T0))s"
          # 兜底：dist 无 boot.img/system_dlkm.img 时，从 bazel-bin 搜刮
          if [ ! -f "$DIST/boot.img" ] && [ ! -f "$DIST/system_dlkm.img" ]; then
            echo "::warning::dist 未见 boot.img/system_dlkm.img，尝试兜底拷贝"
            for base in "$KERNEL_PLATFORM/bazel-bin/common/kernel_aarch64_dist" "$KERNEL_PLATFORM/bazel-bin" "$KERNEL_PLATFORM/out"; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 8 \( -type f -o -type l \) \( -name 'boot.img' -o -name 'system_dlkm.img' -o -name 'Image.lz4' \) -exec cp -nvL {} "$DIST"/ \; 2>/dev/null || true
            done
          fi
          echo "==== dist 最终内容 ===="; ls -la "$DIST"

      # 4b) make（仅编 Image，快速验证）
      - name: 编译内核镜像（make 快速路线）
        if: env.BUILD_SYSTEM == 'make'
        run: |
          set -uo pipefail
          COMMON="$KERNEL_PLATFORM/common"
          cd "$COMMON"
          LOG="$GITHUB_WORKSPACE/build.log"
          CLANG_DIR=$(find "$KERNEL_PLATFORM/prebuilts/clang/host/linux-x86" -maxdepth 2 -type d -name bin | head -1)
          export PATH="$CLANG_DIR:$PATH"
          export CCACHE_DIR="$HOME/.ccache"; export CCACHE_MAXSIZE="12G"
          clang --version | head -2
          PAHOLE_BIN="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
          [ -x "$PAHOLE_BIN" ] || echo "::warning::pahole 预编译件不在预期位置：$PAHOLE_BIN"
          make -j"$(nproc)" LLVM=1 ARCH=arm64 O=out gki_defconfig >>"$LOG" 2>&1 || {
            echo "::error::gki_defconfig 失败"; tail -40 "$LOG"; exit 1; }
          make -j"$(nproc)" LLVM=1 ARCH=arm64 O=out olddefconfig >>"$LOG" 2>&1 || {
            echo "::error::olddefconfig 失败"; tail -40 "$LOG"; exit 1; }
          make -j"$(nproc)" LLVM=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            PAHOLE="$PAHOLE_BIN" O=out all >>"$LOG" 2>&1 || {
            echo "::error::make all 失败"
            { echo "### ❌ make all 失败"; echo '```'
              grep -inE 'error:|fatal error|undefined!' "$LOG" | head -30; echo '```'
              echo '#### 末尾 40 行'; echo '```'; tail -40 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -v "$COMMON/out/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/dist/" || true
          cp -v "$COMMON/out/System.map" "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          tail -15 "$LOG"

      # 5) 汇总产物
      - name: 汇总产物
        if: always()
        run: |
          set -uo pipefail
          echo "==== dist ===="
          ls -laR "$GITHUB_WORKSPACE/dist" 2>/dev/null | head -60 || true
          {
            echo "### 产物清单"
            echo '```'
            ls -la "$GITHUB_WORKSPACE/dist" 2>/dev/null || echo "(空)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志-${{ env.BUILD_SYSTEM }}
          path: build.log
          if-no-files-found: warn

      - name: 上传 GKI 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GKI产物-${{ env.MODEL }}-${{ env.BUILD_SYSTEM }}
          path: dist/*
          if-no-files-found: warn